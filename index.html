.a2 i{width:21%;aspect-ratio:1;border:1px solid var(--ink);transition:background .4s}
.proj:hover .a2 i:nth-child(3n+1),.proj.on .a2 i:nth-child(3n+1){background:#4d7cff}

.a3 i{padding:2.6% 4%;font-size:max(10px,1.1cqw);font-style:normal;border-radius:14px;max-width:62%;line-height:1.35}
.a4{background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:12.5% 16.6%}

@media (max-width:700px),(max-aspect-ratio:4/5){.pricing{grid-template-columns:1fr;gap:20px}.pricecard h3{font-size:20px}.price{font-size:32px}}
</style>

/* ===== SCROLL ENGINE ===== */
const mon=$('#mon'),os=$('#os'),track=$('#track'),scr=$('#scr'),spacer=$('#spacer');
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
let intro,over,max,cur=0,tgt=0,rafId=0,running=false;
const cl=(v,a=0,b=1)=>Math.min(b,Math.max(a,v)),ease=t=>t*t*(3-2*t);
function measure(){const vh=innerHeight;intro=vh*1.2;over=Math.max(0,track.scrollHeight-scr.clientHeight);max=intro+over+vh*.2;spacer.style.height=(max+vh)+'px';read()}
function read(){tgt=scrollY;if(!running){running=true;rafId=requestAnimationFrame(frame)}}
function frame(){cur=reduce?tgt:cur+(tgt-cur)*.14;if(Math.abs(tgt-cur)<.2)cur=tgt;
 const q=ease(cl(cur/intro));
 os.style.opacity=1-cl(q*3);os.style.transform=`scale(${1+q*.25})`;os.style.visibility=q>.34?'hidden':'visible';
 const sc=.45+.55*ease(cl((q-.1)/.9)),rx=(1-ease(cl((q-.1)/.9)))*14;
 mon.style.opacity=cl((q-.05)*4);mon.style.transform=`translateY(${(1-q)*6}vh) scale(${sc}) rotateX(${rx}deg) rotateY(${(1-q)*-10}deg)`;
 const cp=cl((cur-intro)/(over||1));track.style.transform=`translate3d(0,${-over*cp}px,0)`;
 sky(cl(cur/max));
 if(cur!==tgt){rafId=requestAnimationFrame(frame)}else{running=false;rafId=0}}
addEventListener('scroll',read,{passive:true});addEventListener('resize',measure);addEventListener('orientationchange',()=>setTimeout(measure,250));
if(document.fonts)document.fonts.ready.then(measure);addEventListener('load',measure);
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{const el=document.getElementById(b.dataset.go);scrollTo({top:intro+el.offsetTop,behavior:reduce?'auto':'smooth'})});
let _spotPending=false,_spotX=0,_spotY=0;scr.addEventListener('pointermove',e=>{const r=scr.getBoundingClientRect();_spotX=e.clientX-r.left;_spotY=e.clientY-r.top;if(_spotPending)return;_spotPending=true;requestAnimationFrame(()=>{scr.style.setProperty('--mx',_spotX+'px');scr.style.setProperty('--my',_spotY+'px');_spotPending=false})});
track.addEventListener('focusin',e=>{const s=e.target.closest('section');if(!s)return;const y=intro+Math.min(over,Math.max(0,s.offsetTop+e.target.offsetTop-scr.clientHeight*.3));if(Math.abs(y-scrollY)>40)scrollTo({top:y,behavior:'auto'})});

const _fab=document.getElementById('contactFab'),_modal=document.getElementById('contactModal');

function closeContact(){_modal.hidden=true;document.body.style.overflow=''}
